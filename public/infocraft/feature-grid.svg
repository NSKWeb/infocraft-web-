<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="540" viewBox="0 0 1400 540" role="img" aria-labelledby="title desc">
<title id="title">InfoCraft feature grid</title><desc id="desc">Five creative workspaces: Create, Canvas, Poster, AI Art Director, and Library.</desc>
<rect width="1400" height="540" rx="24" fill="#F4F1E9"/><g font-family="Arial,Helvetica,sans-serif">
<text x="64" y="70" fill="#E94B35" font-size="18" font-weight="700" letter-spacing="4">02 / THE TOOLKIT</text><text x="64" y="122" fill="#171717" font-size="44" font-weight="800">Five focused spaces. One creative flow.</text>
<g transform="translate(64 170)">
<g><rect width="390" height="142" rx="14" fill="#171717"/><text x="26" y="46" fill="#E94B35" font-size="16" font-weight="700">01 / CREATE</text><text x="26" y="94" fill="#F4F1E9" font-size="29" font-weight="700">Turn input into structure</text><text x="26" y="122" fill="#C8C2B8" font-size="15">Text and photo entry</text></g>
<g transform="translate(414)"><rect width="390" height="142" rx="14" fill="#FFFFFF" stroke="#C9C1B5" stroke-width="2"/><text x="26" y="46" fill="#E94B35" font-size="16" font-weight="700">02 / CANVAS</text><text x="26" y="94" fill="#171717" font-size="29" font-weight="700">Shape the visual story</text><text x="26" y="122" fill="#514D46" font-size="15">Templates, palettes, export</text></g>
<g transform="translate(828)"><rect width="390" height="142" rx="14" fill="#E94B35"/><text x="26" y="46" fill="#F4F1E9" font-size="16" font-weight="700">03 / POSTER</text><text x="26" y="94" fill="#FFFFFF" font-size="29" font-weight="700">Create image-led work</text><text x="26" y="122" fill="#FCE1DA" font-size="15">Resolution and ratio controls</text></g>
<g transform="translate(0 164)"><rect width="600" height="142" rx="14" fill="#E8E1D5" stroke="#C9C1B5" stroke-width="2"/><text x="26" y="46" fill="#E94B35" font-size="16" font-weight="700">04 / AI ART DIRECTOR</text><text x="26" y="94" fill="#171717" font-size="29" font-weight="700">Refine with a conversation</text><text x="26" y="122" fill="#514D46" font-size="15">Editorial suggestions you can apply to the canvas</text></g>
<g transform="translate(624 164)"><rect width="594" height="142" rx="14" fill="#FFFFFF" stroke="#C9C1B5" stroke-width="2"/><text x="26" y="46" fill="#E94B35" font-size="16" font-weight="700">05 / LIBRARY</text><text x="26" y="94" fill="#171717" font-size="29" font-weight="700">Keep projects within reach</text><text x="26" y="122" fill="#514D46" font-size="15">Saved infographic projects and message history</text></g>
</g></g></svg>