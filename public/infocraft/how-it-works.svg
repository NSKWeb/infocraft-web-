<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" role="img" aria-labelledby="title desc">
<title id="title">How InfoCraft works</title>
<desc id="desc">A visual explanation of the InfoCraft workflow: provide text or a photo, let AI organize the information, refine it on the canvas, then export, create a poster, or save it to the library.</desc>
<defs>
  <style>
    .ink{fill:#171717}.muted{fill:#625d54}.accent{fill:#e94b35}.paper{fill:#f4f1e9}.card{fill:#fffdf8;stroke:#d8d1c4;stroke-width:2}.line{stroke:#171717;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}.soft{fill:#e9e2d5}.small{font:600 18px Arial,sans-serif;letter-spacing:1.8px}.heading{font:700 31px Arial,sans-serif}.body{font:400 21px Arial,sans-serif}.number{font:700 25px Arial,sans-serif}
  </style>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto"><path d="M1 1L10 6L1 11" fill="none" stroke="#171717" stroke-width="2"/></marker>
</defs>
<rect width="1200" height="900" rx="28" class="paper"/>
<text x="70" y="82" class="small accent">THE INFOCRAFT METHOD / 01—04</text>
<text x="70" y="140" class="ink" style="font:700 54px Arial,sans-serif">From raw input to visual clarity.</text>
<text x="70" y="184" class="muted body">A simple four-stage journey — with flexible ways to finish your work.</text>

<!-- flow connectors -->
<path d="M340 370H420" class="line" marker-end="url(#arrow)"/>
<path d="M635 370H715" class="line" marker-end="url(#arrow)"/>
<path d="M930 370H1010" class="line" marker-end="url(#arrow)"/>

<!-- cards -->
<rect x="60" y="245" width="280" height="300" rx="20" class="card"/>
<circle cx="105" cy="294" r="25" class="accent"/><text x="105" y="303" text-anchor="middle" fill="#fff" class="number">01</text>
<text x="90" y="365" class="heading ink">Bring input</text>
<text x="90" y="407" class="body muted">Paste notes, facts,</text><text x="90" y="437" class="body muted">metrics or choose</text><text x="90" y="467" class="body muted">a photo.</text>
<rect x="90" y="492" width="82" height="30" rx="8" class="soft"/><text x="131" y="513" text-anchor="middle" class="small ink">TEXT</text>
<rect x="181" y="492" width="100" height="30" rx="8" class="soft"/><text x="231" y="513" text-anchor="middle" class="small ink">PHOTO</text>

<rect x="420" y="245" width="215" height="300" rx="20" class="card"/>
<circle cx="465" cy="294" r="25" class="accent"/><text x="465" y="303" text-anchor="middle" fill="#fff" class="number">02</text>
<text x="450" y="365" class="heading ink">AI structures</text>
<text x="450" y="407" class="body muted">Finds a headline,</text><text x="450" y="437" class="body muted">key points, metrics</text><text x="450" y="467" class="body muted">and takeaways.</text>
<path d="M457 505h140M457 520h95" stroke="#e94b35" stroke-width="7" stroke-linecap="round"/>

<rect x="715" y="245" width="215" height="300" rx="20" class="card"/>
<circle cx="760" cy="294" r="25" class="accent"/><text x="760" y="303" text-anchor="middle" fill="#fff" class="number">03</text>
<text x="745" y="365" class="heading ink">Refine canvas</text>
<text x="745" y="407" class="body muted">Choose a template</text><text x="745" y="437" class="body muted">and palette. Edit</text><text x="745" y="467" class="body muted">the visual hierarchy.</text>
<rect x="745" y="494" width="150" height="30" rx="7" class="soft"/><rect x="754" y="502" width="35" height="14" rx="3" class="accent"/><rect x="798" y="502" width="85" height="5" rx="2" class="ink"/><rect x="798" y="512" width="65" height="4" rx="2" class="muted"/>

<rect x="1010" y="245" width="145" height="300" rx="20" class="ink"/>
<circle cx="1055" cy="294" r="25" fill="#e94b35"/><text x="1055" y="303" text-anchor="middle" fill="#fff" class="number">04</text>
<text x="1035" y="365" fill="#fff" class="heading">Finish</text>
<text x="1035" y="407" fill="#e9e2d5" class="body">Export</text><text x="1035" y="437" fill="#e9e2d5" class="body">Poster</text><text x="1035" y="467" fill="#e9e2d5" class="body">Library</text>
<path d="M1035 505h92" stroke="#e94b35" stroke-width="5" stroke-linecap="round"/>

<!-- optional assist layer -->
<rect x="60" y="620" width="1095" height="190" rx="20" fill="#e9e2d5"/>
<text x="95" y="675" class="small accent">ALONG THE WAY</text>
<text x="95" y="728" class="heading ink">AI Art Director</text>
<text x="95" y="768" class="body muted">Ask for clearer copy, stronger hierarchy or a better layout direction.</text>
<path d="M625 660V770" stroke="#c9c0b1" stroke-width="2"/>
<text x="680" y="675" class="small accent">OPTIONAL CONTEXT</text>
<text x="680" y="728" class="heading ink">Search grounding</text>
<text x="680" y="768" class="body muted">Enrich selected workflows with web context and available citations.</text>
<text x="70" y="860" class="small muted">INFOCRAFT / CLARITY, COMPOSED.</text>
<text x="1130" y="860" text-anchor="end" class="small muted">VISUAL GUIDE</text>
</svg>